name: Update CFIP artifacts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner target
        required: true
        default: self-hosted-windows
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
          - self-hosted-windows

permissions:
  contents: write

concurrency:
  group: cfip-publisher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ github.event_name == 'schedule' && fromJSON('["self-hosted","windows","x64"]') || inputs.runner_label == 'self-hosted' && fromJSON('["self-hosted","linux","x64"]') || inputs.runner_label == 'self-hosted-windows' && fromJSON('["self-hosted","windows","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"

      - name: Install CloudflareSpeedTest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          asset_url="$(python - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "CFIP-Actions"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          matches = [
              asset["browser_download_url"]
              for asset in release["assets"]
              if asset["name"].endswith("linux_amd64.tar.gz")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one linux_amd64 CFST asset, found {len(matches)}")
          print(matches[0])
          PY
          )"
          curl --fail --location --retry 3 --output cfst.tar.gz "$asset_url"
          mkdir -p .cflip/bin
          tar -xzf cfst.tar.gz -C .cflip/bin
          chmod +x .cflip/bin/cfst

      - name: Install CloudflareSpeedTest (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'CFIP-Actions' } -Uri 'https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest'
          $asset = @($release.assets | Where-Object { $_.name -match '^cfst_windows_amd64\.zip$' })
          if ($asset.Count -ne 1) { throw "Expected one Windows x64 CFST asset, got $($asset.Count)" }
          New-Item -ItemType Directory -Force -Path '.cflip/bin' | Out-Null
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile 'cfst.zip'
          Expand-Archive -Path 'cfst.zip' -DestinationPath '.cflip/bin' -Force

      - name: Run CFIP publisher (Linux)
        if: runner.os != 'Windows'
        env:
          CFST_PATH: .cflip/bin/cfst
          CFIP_LOCATION: BJ
        run: python scripts/cflip.py

      - name: Run CFIP publisher (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CFST_PATH: .cflip/bin/cfst.exe
          CFIP_LOCATION: CD
        run: |
          $ErrorActionPreference = 'Stop'
          & 'H:\CodeApp\Anaconda\python.exe' --version
          & 'H:\CodeApp\Anaconda\python.exe' scripts/cflip.py

      - name: Commit changed artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- CloudflareSpeedTest_CD.csv CloudflareSpeedTest_BJ.csv proxyip-best.txt .cflip/last-success.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No generated changes to commit.'
            exit 0
          }
          git commit -m 'chore: update CFIP artifacts'
          git push
